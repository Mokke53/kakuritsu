name: Migrate reitoproject into kakuritsu

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout kakuritsu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        run: |
          git clone --depth=1 https://github.com/m1o9k7k8e-bot/reitoproject.git /tmp/reitoproject

      - name: Copy source files and historical data
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/migrate.yml' \
            /tmp/reitoproject/ ./

      - name: Commit migration
        run: |
          git config user.name "kakuritsu-migration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Migrate reitoproject files and data"
            git push origin HEAD:main
          fi
